name: Native core prototype

on:
  push:
    paths: ['experiments/nativecore/**', 'breach/**', '.github/workflows/nativecore.yml']
  pull_request:
    paths: ['experiments/nativecore/**', 'breach/**', '.github/workflows/nativecore.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packet-bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: experiments/nativecore
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            experiments/nativecore/go.sum
            breach/go.sum
      - run: go test -timeout 90s ./...
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race -timeout 90s ./...
      - if: runner.os == 'Linux'
        run: sh scripts/portability.sh
      - if: runner.os == 'Linux'
        run: sh scripts/linux-tun.sh
      - if: runner.os == 'macOS'
        run: sh scripts/macos-tun.sh
      - if: runner.os == 'macOS'
        run: sh scripts/apple-link.sh "$RUNNER_TEMP/nativecore-apple"
