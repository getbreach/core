name: Exit image

# Publishes the ready-to-run exit container to
#   ghcr.io/<owner>/breach-exit:{latest,<tag>,sha-<short>}
# for linux/amd64 + linux/arm64, so a VPS only ever runs `docker run` / compose
# and never has to clone the repo or build Go.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      # Only rebuild the exit image when the SERVER side changes: breach-server
      # (cmd/server + its deps media, dtlscfg), the deploy container, the module
      # deps, or this workflow. Client-only changes (cmd/client, maxproto, turn,
      # mobile) don't ship in the image, so they don't trigger a rebuild.
      - 'breach/cmd/server/**'
      - 'breach/cmd/mgmt/**'
      - 'breach/mgmt/**'
      - 'breach/media/**'
      - 'breach/dtlscfg/**'
      - 'breach/deploy/**'
      - 'breach/go.mod'
      - 'breach/go.sum'
      - '.github/workflows/exit-image.yml'
  workflow_dispatch:

jobs:
  image:
    name: build + push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry refs must be lowercase)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/breach-exit" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: breach
          file: breach/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (hy2-only — needs no caps)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -eux
          # Boot the just-pushed image and check the exit really comes up:
          # sing-box starts, a user can be provisioned, the block is valid JSON,
          # and the container survives the sing-box bounce that provisioning does.
          docker run -d --name smoke -e PROTO=hy2 -e PUBLIC_ENDPOINT=203.0.113.1:48000 "$REF"
          for _ in $(seq 40); do
            docker logs smoke 2>&1 | grep -q 'breach-exit: PROTO=hy2' && break
            sleep 1
          done
          docker logs smoke
          # sing-box is a custom minimal build: assert the two tags the exit needs
          # are actually in it (a missing with_gvisor passes `check` and only
          # breaks when the WG tun starts, so verify the tag itself, not a config).
          docker exec smoke sing-box version
          docker exec smoke sing-box version | grep -q 'with_quic'
          docker exec smoke sing-box version | grep -q 'with_gvisor'
          # per-user Hy2 traffic/online state rides on the Clash API
          docker exec smoke sing-box version | grep -q 'with_clash_api'
          docker exec smoke provision-client smoketest | tee /tmp/block
          sed -n '/CONFIG-BEGIN/,/CONFIG-END/p' /tmp/block | sed '1d;$d' | python3 -m json.tool
          docker exec smoke list-clients | python3 -m json.tool
          docker exec smoke stats | python3 -m json.tool
          # ---- per-user Hy2 accounting wiring --------------------------------
          # sing-box only attributes traffic to a NAMED user, and the poller can
          # only reach the API if the config carries one. Both are silent
          # failures (stats just stay 0), so assert the wiring explicitly.
          docker exec smoke cat /etc/breach/hy2_users | grep -qP 'smoketest\t.+' \
            || { echo "hy2_users lost the client name"; docker exec smoke cat /etc/breach/hy2_users; exit 1; }
          docker exec smoke cat /etc/breach/singbox.json > /tmp/sb.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/sb.json'))
          users = [i for i in d["inbounds"] if i["type"] == "hysteria2"][0]["users"]
          assert any(u.get("name") == "smoketest" for u in users), users
          api = d["experimental"]["clash_api"]
          assert api["external_controller"] == "127.0.0.1:51822", api
          assert api["secret"], "clash api has no secret"
          print("hy2 users named + clash_api on loopback with a secret")
          PY
          # and the API must actually answer breach-mgmt with that secret.
          # provision-client above bounced sing-box (reload_hy2 -> pkill) and the
          # supervisor sleeps before relaunching, so poll instead of one-shot.
          docker exec smoke sh -c '
            for i in $(seq 30); do
              if curl -fsS -H "Authorization: Bearer $(cat /etc/breach/clash-secret)" \
                   http://127.0.0.1:51822/connections > /tmp/conns; then cat /tmp/conns; exit 0; fi
              sleep 1
            done
            echo "clash api never came up" >&2; exit 1
          ' | python3 -c 'import sys,json;json.load(sys.stdin);print("clash api reachable")'
          # ---- management API (breach-mgmt) end-to-end ----------------------
          # Built in by default (ARG MGMT=1) and started by default
          # (MGMT_ENABLE=1), listening on tcp/48000 inside the container. Drive
          # the full add/list/remove path THROUGH the pinned-TLS API, and prove a
          # wrong secret is rejected.
          docker exec smoke sh -c 'command -v breach-mgmt'
          for _ in $(seq 20); do docker exec smoke test -f /etc/breach/mgmt.json && break; sleep 1; done
          H="$(docker exec smoke cat /etc/breach/mgmt.json)"; echo "$H" | python3 -m json.tool
          docker logs smoke 2>&1 | grep -q 'BREACH-MGMT-BEGIN'
          P="$(echo "$H" | python3 -c 'import sys,json;print(json.load(sys.stdin)["port"])')"
          S="$(echo "$H" | python3 -c 'import sys,json;print(json.load(sys.stdin)["secret"])')"
          BASE="https://127.0.0.1:$P/$S"
          docker exec smoke curl -fsS --insecure "$BASE/health" | python3 -m json.tool
          docker exec smoke curl -fsS --insecure -H 'Content-Type: application/json' \
            -d '{"name":"apitest"}' "$BASE/clients" \
            | python3 -c 'import sys,json;assert json.load(sys.stdin)["config"]["name"]=="apitest"'
          docker exec smoke list-clients \
            | python3 -c 'import sys,json;assert any(c["name"]=="apitest" for c in json.load(sys.stdin))'
          docker exec smoke curl -fsS --insecure -X DELETE "$BASE/clients/apitest" | python3 -m json.tool
          docker exec smoke list-clients \
            | python3 -c 'import sys,json;assert all(c["name"]!="apitest" for c in json.load(sys.stdin))'
          # a bad secret must 404 (curl -f => non-zero); success here is a failure
          if docker exec smoke curl -fsS --insecure "https://127.0.0.1:$P/wrongsecret/health"; then
            echo "mgmt accepted a wrong secret!"; exit 1
          fi
          # the deployment files must ride inside the image (install.sh extracts
          # them from here instead of raw.githubusercontent, so a private repo works)
          for f in docker-compose.yml docker-compose.hy2.yml .env.example install.sh; do
            docker run --rm --entrypoint cat "$REF" "/usr/local/share/breach/$f" | head -1
          done
          sleep 5
          [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ]
          docker exec smoke pgrep -f 'sing-box run' >/dev/null
          docker rm -f smoke

      - name: Smoke test (both protocols — exercises the WG tun path)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -eux
          sudo modprobe tun 2>/dev/null || true
          # PROTO=both is the mode that actually starts wireguard-go and sing-box's
          # tun. A sing-box built without with_gvisor passes `check` and dies only
          # here, so this is the test that guards the minimal build.
          docker run -d --name smoke2 --init \
            --cap-add NET_ADMIN --device /dev/net/tun --sysctl net.ipv4.ip_forward=1 \
            -e PROTO=both -e PUBLIC_ENDPOINT=203.0.113.1:48000 "$REF"
          for _ in $(seq 40); do
            docker logs smoke2 2>&1 | grep -q 'breach-exit: PROTO=both' && break
            sleep 1
          done
          sleep 5
          docker logs smoke2 || true
          # Some GitHub runners won't let a container create a userspace TUN
          # (wireguard-go dies with "Unable to modify interface: Not supported"),
          # a runner limitation, not an image defect -- the image runs in production
          # and the hy2 path already passed. Skip rather than fail so a runner flake
          # doesn't block the build; a real breakage (container up but a check
          # failing) still fails below.
          if [ "$(docker inspect -f '{{.State.Running}}' smoke2 2>/dev/null)" != true ]; then
            if docker logs smoke2 2>&1 | grep -qi 'Unable to modify interface'; then
              echo "::warning::WG-tun smoke skipped -- this runner can't create a userspace TUN in a container"
              docker rm -f smoke2 || true
              exit 0
            fi
            echo "container exited for a non-TUN reason:"; docker logs smoke2 || true
            exit 1
          fi
          # container is up -> both inner servers must be live: wireguard-go's wg0
          # and sing-box's tun
          docker exec smoke2 ip link show wg0
          docker exec smoke2 ip link show singtun
          docker exec smoke2 wg show wg0 >/dev/null
          docker exec smoke2 ip rule list | grep -q '10.9.0.0/24'
          # and nothing may have complained about a stripped-out feature
          ! docker logs smoke2 2>&1 | grep -iE 'not included in this build'
          docker exec smoke2 provision-client wgtest | grep -q '"wireguard":{'
          docker exec smoke2 stats | python3 -m json.tool
          [ "$(docker inspect -f '{{.State.Running}}' smoke2)" = true ]
          docker rm -f smoke2

      - name: Summary
        run: |
          {
            echo "### breach-exit pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
